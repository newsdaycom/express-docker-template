# Purpose:
#   Local Docker Compose runtime for services generated from this Express
#   template.
#
# Usage:
#   Set ENV=local and run `bash ./rebuild` to rebuild the image, recreate the
#   container, and follow logs.
#
# Operational Notes:
#   Replace all `express-docker-template` values when creating a real service.
#   The external `special-projects` network is expected to exist in the local
#   Newsday Docker environment.

services:
  express-docker-template:
    # Container identity should match the generated service slug.
    container_name: express-docker-template
    hostname: express-docker-template
    volumes:
      # Bind source for local watch mode while keeping container-owned
      # dependency and bundle directories isolated from the host.
      - .:/usr/app
      - /usr/app/node_modules
      - /usr/app/bin
    build:
      context: .
    environment:
      # ENV controls start-service behavior and webpack build mode.
      - ENV
      # BUILD_VERSION is omitted in deployed environments so image build args can
      # supply the real deploy tag.
      - BUILD_VERSION=local-build
      # NODE_ENV should be local for template development and production for
      # stage/prod deployments.
      - NODE_ENV=${ENV}
      # Source maps make container stack traces point back to source files.
      - NODE_OPTIONS=--enable-source-maps
      # Logging defaults are safe for local development and can be overridden by
      # generated services.
      - LOG_LEVEL=info
      - LOG_PRETTY=on
      # Redis Streams local defaults are intentionally insecure and local-only.
      # Stage/prod deployments must inject secure rediss:// Valkey URLs.
      - REDIS_URL=redis://redis:6379
      - REDIS_STREAM_PREFIX=local
      - REDIS_CONSUMER_GROUP=express-docker-template
      - REDIS_CONSUMER_NAME=express-docker-template-local
      - REDIS_BLOCK_MS=5000
      - REDIS_BATCH_SIZE=10
      - REDIS_PENDING_IDLE_MS=60000
      - REDIS_SCHEDULED_SET=local:scheduled-jobs
    depends_on:
      redis:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
  redis:
    # Local-only Redis instance used to exercise stream helpers during service
    # development. Do not mirror this insecure URL into stage or production.
    image: redis:7-alpine
    container_name: express-docker-template-redis
    hostname: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  redis-data:
    # Local Redis persistence for delayed records and stream entries.
networks:
  default:
    name: special-projects
    external: true
